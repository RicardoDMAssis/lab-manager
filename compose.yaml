services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=lab_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=senha_secreta

  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=lab_db
      - DB_USER=admin
      - DB_PASS=senha_secreta
      - DB_HOST=db
    depends_on:
      - db
      
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data:
